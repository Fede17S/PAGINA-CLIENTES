<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CoreDistri Central</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f2f0eb;
      --surface:   #ffffff;
      --navy:      #1a1d36;
      --navy2:     #252847;
      --gold:      #c9a84c;
      --gold-lt:   #f5edda;
      --text:      #1a1d36;
      --muted:     #7a7f99;
      --border:    #e4e1d8;
      --danger:    #dc2626;
      --r:         12px;
      --sh:        0 1px 4px rgba(26,29,54,.07), 0 4px 16px rgba(26,29,54,.06);
      --sh-md:     0 4px 24px rgba(26,29,54,.13);
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .75s linear infinite; }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      background: var(--navy);
      position: relative;
      overflow: hidden;
    }
    .login-deco {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 80% 50%, rgba(201,168,76,.12) 0%, transparent 70%),
                  radial-gradient(ellipse 40% 40% at 10% 90%, rgba(201,168,76,.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-inner { display: flex; align-items: center; justify-content: center; width: 100%; padding: 2rem 1.5rem; position: relative; z-index: 1; }
    .login-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .login-eyebrow {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .5rem;
    }
    .login-logo {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: .35rem;
    }
    .login-sub { font-size: .875rem; color: var(--muted); margin-bottom: 2rem; }

    .field + .field { margin-top: 1rem; }
    .field-label { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .45rem; }
    .field-input {
      width: 100%;
      padding: .875rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      letter-spacing: .05em;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.15); }

    .btn-login {
      width: 100%;
      margin-top: 1.5rem;
      padding: .9rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-family: 'DM Sans', sans-serif;
      font-size: .9375rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: opacity .15s, transform .1s;
    }
    .btn-login:hover:not(:disabled) { opacity: .88; }
    .btn-login:active:not(:disabled) { transform: scale(.99); }
    .btn-login:disabled { opacity: .45; cursor: not-allowed; }

    .login-error {
      margin-top: 1rem;
      padding: .7rem 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: .85rem;
      color: var(--danger);
    }

    /* ── APP HEADER ── */
    .app-header {
      height: 58px;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,.25);
      gap: 1rem;
    }
    .hdr-logo { font-family: 'Fraunces', serif; font-size: 1.15rem; color: #fff; white-space: nowrap; flex-shrink: 0; }
    .hdr-logo em { font-style: normal; color: var(--gold); }
    .hdr-client {
      font-size: .78rem;
      color: rgba(255,255,255,.65);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }
    .hdr-actions { display: flex; gap: .625rem; flex-shrink: 0; align-items: center; }
    .btn-logout {
      font-size: .75rem;
      color: rgba(255,255,255,.5);
      background: none;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      padding: .3rem .6rem;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: color .15s, border-color .15s;
    }
    .btn-logout:hover { color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.4); }

    .cart-btn {
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 10px;
      padding: .45rem .875rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: .875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: opacity .15s;
      position: relative;
    }
    .cart-btn:hover { opacity: .88; }
    .cart-badge {
      background: var(--navy);
      color: #fff;
      border-radius: 50%;
      width: 19px;
      height: 19px;
      font-size: .7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── CATALOG LAYOUT ── */
    .catalog-body { display: flex; height: calc(100vh - 58px); overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 210px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem 0;
    }
    .sidebar-label { font-size: .67rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 1rem .75rem; }
    .cat-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem 1rem;
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      border-left: 3px solid transparent;
      transition: background .1s;
    }
    .cat-item:hover { background: var(--bg); }
    .cat-item.active { background: var(--gold-lt); border-left-color: var(--gold); font-weight: 700; color: var(--navy); }
    .cat-count {
      margin-left: auto;
      font-size: .7rem;
      background: var(--bg);
      border-radius: 20px;
      padding: .1rem .45rem;
      color: var(--muted);
      font-weight: 600;
    }
    .cat-item.active .cat-count { background: rgba(201,168,76,.18); color: var(--navy); }

    /* ── MAIN ── */
    .main-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

    /* Mobile categories strip */
    .mobile-cats { display: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: .625rem 1rem; overflow-x: auto; gap: .5rem; }
    .mobile-cats::-webkit-scrollbar { display: none; }
    .mob-cat-btn {
      flex-shrink: 0;
      padding: .35rem .875rem;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, border-color .12s, color .12s;
    }
    .mob-cat-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    .search-row { padding: 1.125rem 1.25rem .5rem; display: flex; gap: .75rem; }
    .search-input {
      flex: 1;
      padding: .7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      font-family: 'DM Sans', sans-serif;
      font-size: .9375rem;
      background: var(--surface);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.12); }

    .results-info { padding: 0 1.25rem .75rem; font-size: .78rem; color: var(--muted); }

    .grid-wrap { padding: 0 1.25rem 1.5rem; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .875rem; }

    /* ── PRODUCT CARD ── */
    .p-card {
      background: var(--surface);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow .15s, transform .12s;
    }
    .p-card:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
    .p-img-wrap { height: 148px; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .p-img { width: 100%; height: 100%; object-fit: contain; padding: .5rem; }
    .p-placeholder { font-size: 2.5rem; opacity: .3; }
    .p-body { padding: .875rem; flex: 1; display: flex; flex-direction: column; gap: .2rem; }
    .p-cat { font-size: .65rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--gold); }
    .p-code { font-family: 'JetBrains Mono', monospace; font-size: .68rem; color: var(--muted); }
    .p-name { font-size: .875rem; font-weight: 600; line-height: 1.35; flex: 1; margin-top: .1rem; }
    .p-price { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; color: var(--navy); margin-top: .35rem; margin-bottom: .625rem; }

    .btn-add {
      width: 100%;
      padding: .5rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .12s;
    }
    .btn-add:hover { opacity: .85; }

    .qty-ctrl { display: flex; align-items: center; justify-content: center; gap: .5rem; }
    .qty-btn {
      width: 30px; height: 30px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .1s, background .1s;
    }
    .qty-btn:hover { border-color: var(--gold); background: var(--gold-lt); }
    .qty-num { font-weight: 700; font-size: .9375rem; min-width: 22px; text-align: center; }

    /* ── CART PANEL ── */
    @keyframes fadeInOverlay { to { opacity: 1; } }
    @keyframes slideInPanel { to { transform: translateX(0); } }

    .cart-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.42);
      z-index: 200;
      opacity: 0;
      animation: fadeInOverlay .2s forwards;
    }
    .cart-panel {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 420px;
      max-width: 100vw;
      background: var(--surface);
      z-index: 201;
      display: flex;
      flex-direction: column;
      box-shadow: -6px 0 30px rgba(0,0,0,.18);
      transform: translateX(100%);
      animation: slideInPanel .25s cubic-bezier(.22,.61,.36,1) forwards;
    }
    .cart-hdr {
      padding: 1.125rem 1.375rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .cart-hdr-title { font-family: 'Fraunces', serif; font-size: 1.2rem; }
    .btn-close {
      width: 34px; height: 34px;
      background: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: background .1s, color .1s;
    }
    .btn-close:hover { background: var(--border); color: var(--text); }

    .cart-items-area { flex: 1; overflow-y: auto; padding: .75rem 1.375rem; }

    .empty-cart { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: .75rem; color: var(--muted); text-align: center; padding: 2rem; }
    .empty-icon { font-size: 3rem; opacity: .4; }
    .empty-title { font-weight: 600; font-size: .9375rem; }
    .empty-sub { font-size: .8rem; }

    .ci {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .ci-info { flex: 1; min-width: 0; }
    .ci-name { font-size: .875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ci-unit { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
    .ci-total { font-weight: 700; font-size: .9375rem; min-width: 72px; text-align: right; flex-shrink: 0; }

    .cart-footer { padding: 1.125rem 1.375rem; border-top: 1px solid var(--border); flex-shrink: 0; }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
    .total-label { font-size: .8rem; color: var(--muted); }
    .total-amount { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 600; }

    .btn-confirm {
      width: 100%;
      padding: .9rem;
      background: linear-gradient(135deg, var(--gold) 0%, #e0ba65 100%);
      color: var(--navy);
      border: none;
      border-radius: var(--r);
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: .9375rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      transition: opacity .15s, transform .1s;
      box-shadow: 0 4px 14px rgba(201,168,76,.35);
    }
    .btn-confirm:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .btn-confirm:active:not(:disabled) { transform: translateY(0); }
    .btn-confirm:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    /* ── LOADING STATE ── */
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 58px); gap: 1rem; color: var(--muted); }

    /* ── TOAST / SUCCESS ── */
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(20px) scale(.95); } }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy);
      color: #fff;
      padding: .875rem 1.5rem;
      border-radius: 40px;
      font-size: .9rem;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      animation: toastIn .3s cubic-bezier(.22,.61,.36,1) forwards;
      white-space: nowrap;
    }
    .toast.out { animation: toastOut .3s forwards; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .mobile-cats { display: flex; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: .625rem; }
      .grid-wrap { padding: 0 .875rem 1.25rem; }
      .search-row { padding: .875rem .875rem .375rem; }
      .results-info { padding: 0 .875rem .625rem; }
      .hdr-client { display: none; }
    }
    @media (max-width: 380px) {
      .product-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ═══════════════════════════════════════════════════
   ██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗
  ██╔════╝██╔═══██╗████╗  ██║██╔════╝██║██╔════╝
  ██║     ██║   ██║██╔██╗ ██║█████╗  ██║██║  ███╗
  ██║     ██║   ██║██║╚██╗██║██╔══╝  ██║██║   ██║
  ╚██████╗╚██████╔╝██║ ╚████║██║     ██║╚██████╔╝
   ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝     ╚═╝ ╚═════╝
   Editá solo este bloque para configurar la app
═══════════════════════════════════════════════════ */
const CONFIG = {
  DB_URL:           'https://distrimar-5e1a3-default-rtdb.firebaseio.com',
  CLIENTES_NODE:    'usuarios',       // ← ¡VERIFICAR! Nodo padre de los clientes en Firebase
  PRODUCTOS_NODE:   'productos',      // ← Nodo de productos (ya confirmado)
  WHATSAPP_NUMERO:  '549XXXXXXXXXX',  // ← Tu número: 549 + número sin 0 (ej: 5492804123456)
};

// Mapeo lista → campo de precio en el producto
// Agregar nuevas listas acá cuando sea necesario
const PRECIO_POR_LISTA = {
  'Clientes':  'precioClientes',
  'Patagonia': 'precioPatagonia',
  // 'ListaNueva': 'precioListaNueva',
};
/* ═══════════════════════════════════════════════ */


// ── Utilidades ──────────────────────────────────
function getPrecio(producto, lista) {
  const campo = PRECIO_POR_LISTA[lista] || 'precioBase';
  return Number(producto[campo] ?? producto.precioBase ?? 0);
}

function fmtPrecio(n) {
  return '$\u202f' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function cleanCat(str) {
  return (str || '').replace(/"/g, '').trim();
}

async function fbGet(path) {
  const res = await fetch(`${CONFIG.DB_URL}/${path}.json`);
  if (!res.ok) throw new Error('Firebase ' + res.status);
  return res.json();
}


// ── PDF ─────────────────────────────────────────
function generarPDF(cliente, carrito, total) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const items = Object.values(carrito).filter(i => i.cantidad > 0);
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' });
  const hora  = ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

  // Header bar
  doc.setFillColor(26, 29, 54);
  doc.rect(0, 0, 210, 40, 'F');

  doc.setTextColor(201, 168, 76);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(19);
  doc.text('CoreDistri Central', 14, 16);

  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  doc.text('Pedido de Compra', 14, 25);
  doc.text(`${fecha}  ·  ${hora}`, 14, 32);

  // Gold accent line
  doc.setFillColor(201, 168, 76);
  doc.rect(0, 40, 210, 1.2, 'F');

  // Client info box
  doc.setFillColor(245, 244, 240);
  doc.rect(14, 47, 182, 24, 'F');
  doc.setTextColor(26, 29, 54);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.text('CLIENTE', 20, 55);
  doc.setFont('helvetica', 'normal');
  doc.text(cliente.name, 48, 55);
  doc.setFont('helvetica', 'bold');
  doc.text('CÓDIGO', 20, 62);
  doc.setFont('helvetica', 'normal');
  doc.text(String(cliente.id), 48, 62);
  doc.setFont('helvetica', 'bold');
  doc.text('LISTA', 20, 69);
  doc.setFont('helvetica', 'normal');
  doc.text(cliente.lista, 48, 69);

  // Table
  const tY = 80;
  doc.setFillColor(245, 237, 218);
  doc.rect(14, tY, 182, 8, 'F');
  doc.setTextColor(26, 29, 54);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(8.5);
  doc.text('CÓD.',    16, tY + 5.5);
  doc.text('PRODUCTO', 36, tY + 5.5);
  doc.text('CANT.',   130, tY + 5.5);
  doc.text('P.UNIT.',  148, tY + 5.5);
  doc.text('SUBTOTAL', 172, tY + 5.5);

  let y = tY + 12;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);

  items.forEach((item, i) => {
    if (y > 268) { doc.addPage(); y = 20; }
    if (i % 2 === 1) {
      doc.setFillColor(250, 249, 246);
      doc.rect(14, y - 5.5, 182, 9, 'F');
    }
    const nombre = item.nombre.length > 44 ? item.nombre.substring(0, 41) + '…' : item.nombre;
    doc.setTextColor(26, 29, 54);
    doc.text(String(item.codigo || ''),  16, y);
    doc.text(nombre,                     36, y);
    doc.text(String(item.cantidad),     135, y);
    doc.text(fmtPrecio(item.precio),    148, y);
    doc.text(fmtPrecio(item.precio * item.cantidad), 172, y);
    y += 9;
  });

  // Divider
  y += 2;
  doc.setDrawColor(201, 168, 76);
  doc.setLineWidth(0.5);
  doc.line(14, y, 196, y);
  y += 4;

  // Total box
  doc.setFillColor(26, 29, 54);
  doc.rect(130, y, 66, 13, 'F');
  doc.setTextColor(201, 168, 76);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text('TOTAL', 135, y + 9);
  doc.text(fmtPrecio(total), 196, y + 9, { align: 'right' });

  // Subtotals line
  doc.setTextColor(26, 29, 54);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.text(`${items.length} producto(s) · ${items.reduce((s,i)=>s+i.cantidad,0)} unidades`, 14, y + 9);

  // Footer
  doc.setTextColor(160, 160, 160);
  doc.setFontSize(7.5);
  doc.text('CoreDistri Central · Pedido generado automáticamente', 105, 290, { align: 'center' });

  const filename = `Pedido_${cliente.id}_${ahora.toISOString().slice(0,10)}.pdf`;
  doc.save(filename);
  return filename;
}


// ── WhatsApp ────────────────────────────────────
function abrirWhatsApp(cliente, carrito, total) {
  const items = Object.values(carrito).filter(i => i.cantidad > 0);
  const fecha = new Date().toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' });

  let txt = `🛒 *Nuevo Pedido — CoreDistri Central*\n\n`;
  txt += `👤 *Cliente:* ${cliente.name}\n`;
  txt += `🆔 *Código:* ${cliente.id}\n`;
  txt += `📋 *Lista:* ${cliente.lista}\n`;
  txt += `📅 *Fecha:* ${fecha}\n\n`;
  txt += `━━━━━━━━━━━━━━━━━━\n`;
  txt += `*Detalle:*\n\n`;
  items.forEach(it => {
    txt += `• *${it.nombre}*\n`;
    txt += `  ${it.cantidad} × ${fmtPrecio(it.precio)} = ${fmtPrecio(it.precio * it.cantidad)}\n`;
  });
  txt += `\n━━━━━━━━━━━━━━━━━━\n`;
  txt += `💰 *TOTAL: ${fmtPrecio(total)}*\n\n`;
  txt += `_(PDF con el detalle completo adjunto)_`;

  window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMERO}?text=${encodeURIComponent(txt)}`, '_blank');
}


// ════════════════════════════════════════════════
// COMPONENTS
// ════════════════════════════════════════════════

// ── Toast ────────────────────────────────────────
function Toast({ msg, onDone }) {
  const [leaving, setLeaving] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setLeaving(true), 2800);
    const t2 = setTimeout(onDone, 3200);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return <div className={`toast${leaving ? ' out' : ''}`}>{msg}</div>;
}

// ── Login ─────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [codigo, setCodigo] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [debug, setDebug] = useState('');

  async function handleLogin(e) {
    e.preventDefault();
    const code = codigo.trim();
    if (!code) return;
    setLoading(true);
    setError('');
    setDebug('');
    try {
      const url1 = `${CONFIG.DB_URL}/${CONFIG.CLIENTES_NODE}/${code}.json`;
      const res1 = await fetch(url1);
      const raw1 = await res1.text();
      let data = raw1 === 'null' ? null : JSON.parse(raw1);
      setDebug(`[1] ${url1}\n→ ${raw1.substring(0,120)}`);

      if (!data) {
        const url2 = `${CONFIG.DB_URL}/${CONFIG.CLIENTES_NODE}.json`;
        const res2 = await fetch(url2);
        const raw2 = await res2.text();
        setDebug(d => d + `\n\n[2] ${url2}\n→ ${raw2.substring(0,300)}`);
        const todos = raw2 === 'null' ? null : JSON.parse(raw2);
        if (todos) {
          data = Object.values(todos).find(u =>
            String(u.id) === code || String(u.pass) === code
          ) || null;
          setDebug(d => d + `\nEncontrado: ${data ? 'SÍ → '+JSON.stringify(data).substring(0,80) : 'NO'}`);
        }
      }

      if (!data) {
        setError('Código no encontrado.');
      } else if (String(data.pass) !== code) {
        setError(`Pass no coincide: en DB es "${data.pass}"`);
      } else if (data.catalogo === false) {
        setError('Cuenta sin acceso al catálogo.');
      } else {
        onLogin(data);
      }
    } catch(err) {
      setError('Error: ' + err.message);
      setDebug(d => d + '\nException: ' + err.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="login-wrap">
      <div className="login-deco" />
      <div className="login-inner">
        <div className="login-card">
          <div className="login-eyebrow">Catálogo Mayorista</div>
          <div className="login-logo">CoreDistri<br/>Central</div>
          <p className="login-sub">Ingresá con tu código de cliente</p>

          <form onSubmit={handleLogin}>
            <div className="field">
              <label className="field-label">Código de cliente</label>
              <input
                className="field-input"
                type="text"
                value={codigo}
                onChange={e => setCodigo(e.target.value)}
                placeholder="Ej: 3829"
                autoFocus
                autoComplete="off"
              />
            </div>
            <button className="btn-login" type="submit" disabled={loading || !codigo.trim()}>
              {loading ? '⏳ Verificando...' : 'Ingresar al catálogo →'}
            </button>
          </form>

          {error && <div className="login-error">⚠ {error}</div>}
          {debug && <pre style={{marginTop:"1rem",padding:".75rem",background:"#f0f0f0",borderRadius:"8px",fontSize:".68rem",whiteSpace:"pre-wrap",wordBreak:"break-all",color:"#333",maxHeight:"220px",overflowY:"auto"}}>{debug}</pre>}
        </div>
      </div>
    </div>
  );
}

// ── Product Card ──────────────────────────────────
function ProductCard({ producto, lista, cantidad, onAdd, onQtyChange }) {
  const [imgOk, setImgOk] = useState(!!producto.foto);
  const precio = getPrecio(producto, lista);
  const cat = cleanCat(producto.categoria);

  return (
    <div className="p-card">
      <div className="p-img-wrap">
        {imgOk
          ? <img className="p-img" src={producto.foto} alt={producto.nombre} onError={() => setImgOk(false)} />
          : <span className="p-placeholder">📦</span>
        }
      </div>
      <div className="p-body">
        {cat && <div className="p-cat">{cat}</div>}
        <div className="p-code">#{producto.codigo}</div>
        <div className="p-name">{producto.nombre}</div>
        <div className="p-price">{fmtPrecio(precio)}</div>
        {cantidad > 0
          ? (
            <div className="qty-ctrl">
              <button className="qty-btn" onClick={() => onQtyChange(cantidad - 1)}>−</button>
              <span className="qty-num">{cantidad}</span>
              <button className="qty-btn" onClick={() => onQtyChange(cantidad + 1)}>+</button>
            </div>
          )
          : <button className="btn-add" onClick={onAdd}>+ Agregar</button>
        }
      </div>
    </div>
  );
}

// ── Cart Panel ────────────────────────────────────
function CartPanel({ carrito, onClose, onQtyChange, onConfirm, confirmando }) {
  const items = useMemo(() => Object.values(carrito).filter(i => i.cantidad > 0), [carrito]);
  const total = useMemo(() => items.reduce((s, i) => s + i.precio * i.cantidad, 0), [items]);

  return (
    <>
      <div className="cart-overlay" onClick={onClose} />
      <div className="cart-panel">
        <div className="cart-hdr">
          <div className="cart-hdr-title">🛒 Carrito</div>
          <button className="btn-close" onClick={onClose}>✕</button>
        </div>

        <div className="cart-items-area">
          {items.length === 0
            ? (
              <div className="empty-cart">
                <div className="empty-icon">🛒</div>
                <div className="empty-title">El carrito está vacío</div>
                <div className="empty-sub">Agregá productos del catálogo</div>
              </div>
            )
            : items.map(item => (
              <div key={item._key} className="ci">
                <div className="ci-info">
                  <div className="ci-name">{item.nombre}</div>
                  <div className="ci-unit">{fmtPrecio(item.precio)} por unidad</div>
                </div>
                <div className="qty-ctrl" style={{ gap: '.35rem' }}>
                  <button className="qty-btn" style={{ width: 27, height: 27 }} onClick={() => onQtyChange(item._key, item.cantidad - 1)}>−</button>
                  <span className="qty-num" style={{ fontSize: '.85rem' }}>{item.cantidad}</span>
                  <button className="qty-btn" style={{ width: 27, height: 27 }} onClick={() => onQtyChange(item._key, item.cantidad + 1)}>+</button>
                </div>
                <div className="ci-total">{fmtPrecio(item.precio * item.cantidad)}</div>
              </div>
            ))
          }
        </div>

        <div className="cart-footer">
          <div className="total-row">
            <div className="total-label">
              {items.length} art · {items.reduce((s,i)=>s+i.cantidad,0)} u
            </div>
            <div className="total-amount">{fmtPrecio(total)}</div>
          </div>
          <button
            className="btn-confirm"
            onClick={() => onConfirm(total)}
            disabled={items.length === 0 || confirmando}
          >
            {confirmando ? '⏳ Generando pedido...' : '📄 Confirmar y enviar por WhatsApp'}
          </button>
        </div>
      </div>
    </>
  );
}

// ── Catalog Screen ────────────────────────────────
function CatalogScreen({ cliente, onLogout }) {
  const [productos, setProductos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [errorMsg, setErrorMsg] = useState('');
  const [catActiva, setCatActiva] = useState('Todas');
  const [busqueda, setBusqueda] = useState('');
  const [carrito, setCarrito] = useState({});
  const [cartOpen, setCartOpen] = useState(false);
  const [confirmando, setConfirmando] = useState(false);
  const [toast, setToast] = useState('');

  useEffect(() => {
    fbGet(CONFIG.PRODUCTOS_NODE)
      .then(data => {
        if (!data) { setProductos([]); return; }
        const arr = Object.entries(data)
          .map(([k, v]) => ({ ...v, _key: k }))
          .filter(p => p.nombre)
          .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'));
        setProductos(arr);
      })
      .catch(() => setErrorMsg('No se pudieron cargar los productos. Verificá tu conexión.'))
      .finally(() => setCargando(false));
  }, []);

  // Categorías únicas con conteo
  const categorias = useMemo(() => {
    const map = {};
    productos.forEach(p => {
      const c = cleanCat(p.categoria);
      if (c) map[c] = (map[c] || 0) + 1;
    });
    return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0], 'es'));
  }, [productos]);

  const totalCat = productos.length;

  // Filtrado
  const productosFiltrados = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    return productos.filter(p => {
      const cat = cleanCat(p.categoria);
      const catOk = catActiva === 'Todas' || cat === catActiva;
      const busqOk = !q
        || (p.nombre || '').toLowerCase().includes(q)
        || String(p.codigo || '').toLowerCase().includes(q)
        || cat.toLowerCase().includes(q);
      return catOk && busqOk;
    });
  }, [productos, catActiva, busqueda]);

  const totalEnCarrito = useMemo(() =>
    Object.values(carrito).reduce((s, i) => s + i.cantidad, 0), [carrito]);

  function agregarProducto(producto) {
    const precio = getPrecio(producto, cliente.lista);
    setCarrito(prev => ({ ...prev, [producto._key]: { ...producto, precio, cantidad: 1 } }));
  }

  function cambiarCantidad(key, qty) {
    if (qty <= 0) {
      setCarrito(prev => { const n = { ...prev }; delete n[key]; return n; });
    } else {
      setCarrito(prev => ({ ...prev, [key]: { ...prev[key], cantidad: qty } }));
    }
  }

  async function confirmarPedido(total) {
    setConfirmando(true);
    try {
      generarPDF(cliente, carrito, total);
      await new Promise(r => setTimeout(r, 600));
      abrirWhatsApp(cliente, carrito, total);
      setCarrito({});
      setCartOpen(false);
      setToast('✅ PDF descargado · WhatsApp abierto');
    } catch {
      setToast('❌ Error al generar el pedido');
    } finally {
      setConfirmando(false);
    }
  }

  function cambiarCat(c) {
    setCatActiva(c);
    setBusqueda('');
  }

  return (
    <>
      <header className="app-header">
        <div className="hdr-logo">Core<em>Distri</em></div>
        <div className="hdr-client">👤 {cliente.name} · Lista: {cliente.lista}</div>
        <div className="hdr-actions">
          <button className="btn-logout" onClick={onLogout}>Salir</button>
          <button className="cart-btn" onClick={() => setCartOpen(true)}>
            🛒
            {totalEnCarrito > 0 && <span className="cart-badge">{totalEnCarrito}</span>}
          </button>
        </div>
      </header>

      {/* Mobile category strip */}
      <div className="mobile-cats">
        <button className={`mob-cat-btn${catActiva === 'Todas' ? ' active' : ''}`} onClick={() => cambiarCat('Todas')}>
          Todas ({totalCat})
        </button>
        {categorias.map(([cat, n]) => (
          <button
            key={cat}
            className={`mob-cat-btn${catActiva === cat ? ' active' : ''}`}
            onClick={() => cambiarCat(cat)}
          >
            {cat} ({n})
          </button>
        ))}
      </div>

      <div className="catalog-body">
        {/* Sidebar */}
        <nav className="sidebar">
          <div className="sidebar-label">Categorías</div>
          <button className={`cat-item${catActiva === 'Todas' ? ' active' : ''}`} onClick={() => cambiarCat('Todas')}>
            Todas <span className="cat-count">{totalCat}</span>
          </button>
          {categorias.map(([cat, n]) => (
            <button
              key={cat}
              className={`cat-item${catActiva === cat ? ' active' : ''}`}
              onClick={() => cambiarCat(cat)}
            >
              <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{cat}</span>
              <span className="cat-count">{n}</span>
            </button>
          ))}
        </nav>

        {/* Main */}
        <div className="main-area">
          <div className="search-row">
            <input
              className="search-input"
              type="search"
              placeholder="🔍  Buscar por nombre o código..."
              value={busqueda}
              onChange={e => setBusqueda(e.target.value)}
            />
          </div>

          {cargando
            ? <div className="loading-screen"><div className="spinner" /><span>Cargando productos...</span></div>
            : errorMsg
              ? <div style={{ padding: '2rem', color: 'var(--danger)' }}>⚠ {errorMsg}</div>
              : (
                <>
                  <div className="results-info">
                    {productosFiltrados.length} producto{productosFiltrados.length !== 1 ? 's' : ''}
                    {catActiva !== 'Todas' ? ` en "${catActiva}"` : ''}
                    {busqueda ? ` · Búsqueda: "${busqueda}"` : ''}
                  </div>
                  <div className="grid-wrap">
                    {productosFiltrados.length === 0
                      ? <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--muted)' }}>No se encontraron productos 🔍</div>
                      : (
                        <div className="product-grid">
                          {productosFiltrados.map(p => (
                            <ProductCard
                              key={p._key}
                              producto={p}
                              lista={cliente.lista}
                              cantidad={carrito[p._key]?.cantidad ?? 0}
                              onAdd={() => agregarProducto(p)}
                              onQtyChange={n => cambiarCantidad(p._key, n)}
                            />
                          ))}
                        </div>
                      )
                    }
                  </div>
                </>
              )
          }
        </div>
      </div>

      {cartOpen && (
        <CartPanel
          carrito={carrito}
          onClose={() => setCartOpen(false)}
          onQtyChange={cambiarCantidad}
          onConfirm={confirmarPedido}
          confirmando={confirmando}
        />
      )}

      {toast && <Toast msg={toast} onDone={() => setToast('')} />}
    </>
  );
}

// ── Root ──────────────────────────────────────────
function App() {
  const [cliente, setCliente] = useState(null);
  return cliente
    ? <CatalogScreen cliente={cliente} onLogout={() => setCliente(null)} />
    : <LoginScreen onLogin={setCliente} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
